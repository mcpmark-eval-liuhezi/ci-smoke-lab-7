name: Demo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build artifact
        run: |
          echo "demo-build: CI smoke test build artifact" > artifact.txt
          cat artifact.txt

      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: artifact.txt
